<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>متجر جميل - قالب حديث</title>
  <style>
    :root{--accent:#0b74de;--bg:#f7f7f9}
    body{font-family: Tahoma, 'Segoe UI', Roboto, Arial; background:var(--bg); margin:0; color:#222}
    header{background:white;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#4fb1ff);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    nav a{margin-left:12px;color:#555;text-decoration:none;font-weight:500}
    nav a:hover{color:var(--accent)}
    .search{flex:1;margin:0 18px}
    input.search-in{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
    .cart-btn{background:var(--accent);color:white;padding:10px 14px;border-radius:8px;border:none}
    main{max-width:1100px;margin:26px auto;padding:0 16px}
    .hero{background:white;padding:22px;border-radius:12px;display:flex;gap:20px;align-items:center}
    .hero img{width:160px;border-radius:12px}
    h1{margin:0 0 6px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
    .card{background:white;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);display:flex;flex-direction:column}
    .card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
    .card h3{margin:10px 0 6px 0;font-size:15px}
    .price{font-weight:700;color:var(--accent)}
    .add{margin-top:auto;padding:8px;border:none;background:#00a86b;color:white;border-radius:8px}
    footer{padding:20px;text-align:center;color:#666;font-size:14px}
    .cart-drawer{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:flex-end;justify-content:flex-end}
    .cart-drawer.open{display:flex}
    .cart-panel{width:380px;background:white;height:100%;box-shadow:-6px 0 30px rgba(2,6,23,0.15);padding:18px;direction:rtl}
    .cart-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
    .checkout{margin-top:12px;padding:10px;border:none;border-radius:8px;background:var(--accent);color:white;width:100%}
    @media(max-width:640px){.hero{flex-direction:column;text-align:center}.hero img{width:120px}}
    /* Contact page */
    .contact-form{background:white;padding:22px;border-radius:12px;max-width:600px;margin:20px auto;box-shadow:0 1px 6px rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:12px}
    .contact-form input, .contact-form textarea{padding:10px;border-radius:6px;border:1px solid #ddd;width:100%}
    .contact-form button{padding:10px;border-radius:8px;border:none;background:var(--accent);color:white;font-weight:600}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">ج</div>
      <div>
        <div style="font-weight:700">متجر جميل</div>
        <div style="font-size:13px;color:#666">بيع كل شيء جميل ومطلوب — داخل فلسطين فقط</div>
      </div>
    </div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="contact.html">اتصل بنا</a>
    </nav>
    <div class="search">
      <input class="search-in" placeholder="ابحث عن منتج...">
    </div>
    <div>
      <button class="cart-btn" id="openCart">سلة (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>مرحبًا بك في متجر جميل</h1>
        <p style="color:#555">متجر جميل — لبيع كل ما هو جميل ومطلوب داخل فلسطين فقط.</p>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button onclick="openCart()" class="cart-btn">اذهب للسلة</button>
          <button onclick="checkoutDemo()" style="background:#eee;border:none;padding:10px;border-radius:8px">خدمة العملاء</button>
        </div>
      </div>
      <img src="https://images.unsplash.com/photo-1604335399108-7c7fb8a1d7c1?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder" alt="hero">
    </section>

    <h2 style="margin-top:18px">منتجات مميزة</h2>
    <div class="grid" id="productsGrid"></div>
  </main>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>سلة التسوق</h3>
        <button onclick="closeCart()">إغلاق</button>
      </div>
      <div id="cartItems" style="margin-top:12px"></div>
      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>الإجمالي</span><strong id="cartTotal">0</strong></div>
        <button class="checkout" onclick="openCheckoutForm()">إتمام الطلب</button>
      </div>
    </div>
  </div>

  <footer>
    © جميع الحقوق محفوظة — متجر جميل. جاهز للبيع داخل فلسطين.
  </footer>

  <script>
    const products = [
      {id:1,title:'طقم فناجين قهوة أنيق',price:35,image:'https://images.unsplash.com/photo-1506806732259-39c2d0268443?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
      {id:2,title:'قميص كاجوال',price:75,image:'https://images.unsplash.com/photo-1520975912162-5f99c6e7b8f0?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
      {id:3,title:'عطر فاخر',price:120,image:'https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
      {id:4,title:'لوحة جدارية ديكور',price:150,image:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
      {id:5,title:'حقيبة يد أنيقة',price:95,image:'https://images.unsplash.com/photo-1543163521-1bf539c55a2a?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
      {id:6,title:'مستحضرات تجميل مختارة',price:60,image:'https://images.unsplash.com/photo-1542831371-d531d36971e6?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder'},
    ];

    const grid = document.getElementById('productsGrid');
    products.forEach(p=>{
      const el = document.createElement('div'); el.className='card';
      el.innerHTML = `<img src="${p.image}" alt="${p.title}"><h3>${p.title}</h3><div class="price">${p.price} ₪</div><button class="add" onclick="addToCart(${p.id})">أضف إلى السلة</button>`;
      grid.appendChild(el);
    })

    function getCart(){return JSON.parse(localStorage.getItem('pf_cart')||'[]')}
    function saveCart(c){localStorage.setItem('pf_cart',JSON.stringify(c)); updateCartCount();}
    function addToCart(id){const p = products.find(x=>x.id===id);let c=getCart();const found=c.find(i=>i.id===id);if(found){found.qty++}else{c.push({id:id,title:p.title,price:p.price,qty:1,image:p.image})}saveCart(c); alert('أضيف المنتج إلى السلة');}
    function updateCartCount(){const c=getCart();document.getElementById('cartCount').innerText=c.reduce((s,i)=>s+i.qty,0)}
    updateCartCount();

    const cartDrawer = document.getElementById('cartDrawer');
    function openCart(){renderCart();cartDrawer.classList.add('open')}
    function closeCart(){cartDrawer.classList.remove('open')}
    document.getElementById('openCart').addEventListener('click',openCart)

    function renderCart(){const items = getCart();const container = document.getElementById('cartItems');container.innerHTML='';let total=0;items.forEach(it=>{total+=it.price*it.qty;const div=document.createElement('div');div.className='cart-item';div.innerHTML=`<img src="${it.image}"><div style="flex:1"><strong>${it.title}</strong><div>${it.qty} × ${it.price} ₪</div></div><div><button onclick="removeItem(${it.id})">حذف</button></div>`;container.appendChild(div)});document.getElementById('cartTotal').innerText=total + ' ₪'}
    function removeItem(id){let c=getCart();c=c.filter(i=>i.id!==id);saveCart(c);renderCart();}

    function openCheckoutForm(){closeCart();document.getElementById('checkoutModal').style.display='flex'}
    function closeCheckout(){document.getElementById('checkoutModal').style.display='none'}
    document.getElementById('checkoutForm')?.addEventListener('submit',function(e){e.preventDefault();const data = new FormData(e.target);const order = {customer:Object.fromEntries(data.entries()),items:getCart(),total: getCart().reduce((s,i)=>s+i.price*i.qty,0)}; if(!order.customer.city){alert('اختر المدينة داخل فلسطين');return} console.log('طلب جديد',order); alert('تم استلام طلبك (نموذج تجريبي). سيتم التواصل معك لتأكيد التفاصيل.'); localStorage.removeItem('pf_cart');updateCartCount();closeCheckout();})
    function checkoutDemo(){alert('لإتمام الطلب في هذا القالب التجريبي، استخدم زر سلة التسوق ثم نموذج إتمام الطلب.\nلربط بوابة دفع محلية أو نظام شحن حقيقي نحتاج لتجهيزات استضافة وحسابات بوابات دفع')}
  </script>
</body>
</html>
